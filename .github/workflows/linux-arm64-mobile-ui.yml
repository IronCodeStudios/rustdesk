# Builds an aarch64 Linux .deb, optionally with the mobile UI compiled in,
# for Linux phones (PinePhone Pro, Librem 5, postmarketOS).
#
# Why this exists: Flutter ships no arm64 Linux SDK, so neither the x86 dev box
# nor an 8 GB M1 can produce a phone package conveniently. But Flutter *does*
# publish arm64 Linux ENGINE artifacts, and Dart publishes an arm64 Linux SDK
# separately - so the x64 SDK tarball plus a swapped dart-sdk builds arm64
# natively on an arm64 runner. Same trick upstream already uses for Windows
# arm64 in flutter-build.yml.
name: linux-arm64-mobile-ui

on:
  workflow_dispatch:
    inputs:
      mobile_ui:
        description: "Compile the mobile UI in (RUSTDESK_FORCE_MOBILE_UI)"
        type: boolean
        default: true
  push:
    branches: [feat/mobile-ui-on-linux]

env:
  FLUTTER_VERSION: "3.24.5"
  DART_VERSION: "3.5.4"                                          # bundled with Flutter 3.24.5
  # NOT "FLUTTER_ENGINE" - the Flutter tool reserves that name for the path to a
  # local engine src/ directory, and will try to treat this revision as one.
  FLUTTER_ENGINE_REV: "a18df97ca57a249df5d8d68cd0820600223ce262"   # flutter/3.24.5 bin/internal/engine.version
  RUST_VERSION: "1.75"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  FRB_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_CMAKE_VERSION: "4.3.0"                                   # upstream CI pins this for this vcpkg commit
  VCPKG_FORCE_SYSTEM_BINARIES: "1"                               # required on arm64: vcpkg ships no arm64 cmake/ninja

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive        # libs/hbb_common is a submodule; without this
                                       # cargo dies late with "failed to load manifest
                                       # for workspace member libs/scrap"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ gcc git curl nasm yasm libgtk-3-dev clang libxcb-randr0-dev \
            libxdo-dev libxfixes-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libpulse-dev make wget libssl-dev unzip zip \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            ca-certificates ninja-build python3 pkg-config xz-utils \
            autoconf automake libtool autoconf-archive gettext-base file
          # autotools are NOT in upstream's Dockerfile list. Without them vcpkg
          # stops partway at mfx-dispatch and silently never builds opus.
          # gettext-base only quiets "envsubst: not found" from git submodule.

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --default-toolchain ${{ env.RUST_VERSION }} --component rustfmt
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          # rustfmt is REQUIRED: flutter_rust_bridge_codegen shells out to it and
          # dies on non-zero exit, after leaving a complete-looking
          # bridge_generated.rs but no Dart side at all.

      - name: Install Flutter ${{ env.FLUTTER_VERSION }} with an arm64 Dart SDK
        run: |
          set -euxo pipefail
          cd "$HOME"
          # The SDK tarball is x64-only, but it is mostly the tool itself.
          curl -fLO "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf "flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"

          # Swap the bundled x64 dart-sdk for the arm64 one Dart publishes.
          curl -fLO "https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-linux-arm64-release.zip"
          rm -rf flutter/bin/cache/dart-sdk
          unzip -q dartsdk-linux-arm64-release.zip -d flutter/bin/cache/
          # The zip contains dart-sdk/, so it lands at the right path already.

          # Stamp it, or the next flutter invocation re-downloads the x64 SDK
          # over the top and silently undoes all of this.
          echo "$FLUTTER_ENGINE_REV" > flutter/bin/cache/engine-dart-sdk.stamp

          # The tarball also ships flutter_tools.snapshot precompiled for x64.
          # An arm64 Dart VM refuses it outright:
          #   "the snapshot requires '... x64 linux ...' but the VM has
          #    '... arm64 linux ...'"
          # Removing the snapshot and its stamp makes bin/internal/shared.sh
          # recompile the tool with the arm64 Dart on first invocation. Costs
          # a couple of minutes, once.
          rm -f flutter/bin/cache/flutter_tools.snapshot \
                flutter/bin/cache/flutter_tools.stamp

          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Verify the toolchain is actually arm64
        run: |
          set -euxo pipefail
          # Check the binary BEFORE invoking flutter: if the swap failed, this
          # names the cause instead of a confusing snapshot-mismatch error.
          file "$HOME/flutter/bin/cache/dart-sdk/bin/dart" | tee /dev/stderr | grep -q 'ARM aarch64'
          "$HOME/flutter/bin/cache/dart-sdk/bin/dart" --version
          flutter --version          # recompiles flutter_tools for arm64 here
          flutter precache --linux
          test -d "$HOME/flutter/bin/cache/artifacts/engine/linux-arm64-release" \
            || { echo "::error::linux-arm64 engine artifacts missing - wrong-arch Dart"; exit 1; }

      - name: Install CMake ${{ env.VCPKG_CMAKE_VERSION }}
        run: |
          set -euxo pipefail
          # Ubuntu 24.04 ships CMake 3.28. This vcpkg commit calls
          # string(JSON ... STRING_ENCODE) in z_vcpkg_spdx.cmake, which needs
          # >= 3.31, so aom dies in 2s with "invalid mode 'STRING_ENCODE'".
          # VCPKG_FORCE_SYSTEM_BINARIES (required on arm64) means vcpkg uses
          # this one rather than fetching its own, so it has to be new enough.
          # Debian trixie already ships 3.31.6, so a trixie container does not
          # need this step - the GitHub runner does.
          cd /tmp
          curl -fLO "https://github.com/Kitware/CMake/releases/download/v${VCPKG_CMAKE_VERSION}/cmake-${VCPKG_CMAKE_VERSION}-linux-aarch64.tar.gz"
          sudo tar -xzf "cmake-${VCPKG_CMAKE_VERSION}-linux-aarch64.tar.gz" -C /opt
          echo "/opt/cmake-${VCPKG_CMAKE_VERSION}-linux-aarch64/bin" >> $GITHUB_PATH

      - name: Set up vcpkg
        run: |
          set -euxo pipefail
          cmake --version | head -1
          cmake --version | head -1 | grep -qE 'version (3\.(3[1-9]|[4-9][0-9])|[4-9]\.)' \
            || { echo "::error::cmake too old for this vcpkg (needs >= 3.31)"; exit 1; }
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$VCPKG_COMMIT_ID"
          "$HOME/vcpkg"/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Build vcpkg dependencies
        run: |
          set -euxo pipefail
          "$VCPKG_ROOT"/vcpkg install --x-install-root="$VCPKG_ROOT/installed"

          # vcpkg can stop early and still exit cleanly, so verify. Check the
          # install tree directly rather than `vcpkg list`: list reports the
          # DEFAULT install root and we used --x-install-root, so it reports
          # nothing and a name check false-fails on a perfectly good build.
          # (mfx-dispatch is x86-only per vcpkg.json - absent here by design.)
          root="$VCPKG_ROOT/installed/arm64-linux"
          echo "--- installed tree ---"
          ls -1 "$root/lib" || true
          for lib in libvpx.a libyuv.a libopus.a libaom.a; do
            test -f "$root/lib/$lib" \
              || { echo "::error::vcpkg did not produce $lib"; exit 1; }
          done

      - name: Generate the flutter_rust_bridge sources
        run: |
          set -euxo pipefail
          # build.py does NOT do this. Upstream generates them in a separate
          # workflow (bridge.yml) and downloads the artifact. Without it the
          # build fails with one real error (missing module bridge_generated)
          # and four misleading IntoIntoDart trait errors.
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --features uuid --locked
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          test -s ./flutter/lib/generated_bridge.dart \
            || { echo "::error::codegen wrote no Dart output"; exit 1; }

      - name: Build
        env:
          DEB_ARCH: arm64
          FLUTTER_BUILD_EXTRA_ARGS: >-
            ${{ (github.event_name == 'push' || inputs.mobile_ui)
                && '--dart-define=RUSTDESK_FORCE_MOBILE_UI=true' || '' }}
        run: |
          set -euxo pipefail
          # Compile-time define, not RUSTDESK_MOBILE_UI=1: the env var reaches the
          # spawned --cm child only where `sudo -E` actually preserves the
          # environment, which is distro-dependent (SUDO_E_PRESERVES_ENV).
          python3 ./build.py --flutter --hwcodec

      - name: Collect the package
        id: deb
        run: |
          set -euxo pipefail
          # build.py chdir's into flutter/ (build.py:715) and never returns, so
          # `dpkg-deb -b tmpdeb rustdesk.deb` writes flutter/rustdesk.deb - NOT
          # the repo root. Search, and show the search, so a miss is diagnosable
          # from the log instead of costing another run. No -maxdepth and no
          # -newermt: both are assumptions, and both have already cost a run.
          echo "--- every .deb in the tree ---"
          find . -name '*.deb' -not -path './.git/*' -printf '%p  %s bytes\n' || true
          echo "--- flutter/ ---"
          ls -la flutter/*.deb flutter/ 2>/dev/null | head -20 || true
          echo "--- target/release/bundle/ ---"
          ls -laR target/release/bundle 2>/dev/null | head -20 || true

          deb=$(find . -name '*.deb' -not -path './.git/*' | head -1)
          test -n "$deb" || { echo "::error::no .deb produced - see listings above"; exit 1; }
          echo "path=$deb" >> $GITHUB_OUTPUT
          echo "Using: $deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'libflutter_linux_gtk|flutter_assets' | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-aarch64${{ (github.event_name == 'push' || inputs.mobile_ui) && '-mobile-ui' || '' }}
          path: ${{ steps.deb.outputs.path }}
          if-no-files-found: error
          retention-days: 14
